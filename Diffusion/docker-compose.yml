  # DB browser: docker compose --profile debug up -d adminer  -> localhost:8080
  adminer:
    image: adminer
    profiles: [debug]
    ports: ["8080:8080"]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  # Generated PNGs (the S3 stand-in). DB lives in pgdata now.
  data:
  pgdata:
  rabbitdata:
